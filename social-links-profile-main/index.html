<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- displays site properly based on user's device -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Frontend Mentor | Social links profile</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <div class="card">
        <div class="card-profile">
          <img
            class="card-avatar"
            alt="Profile picture of Jessica Randall"
            src="assets/images/avatar-jessica.jpeg"
          />
          <div class="card-info">
            <h2 class="card-name">Jessica Randall</h2>
            <div class="card-location">London, United Kingdom</div>
          </div>
          <div class="card-bio">"Front-end developer and avid reader."</div>
        </div>
        <div class="social-links">
          <button class="link-button">GitHub</button>
          <button class="link-button">Frontend Mentor</button>
          <button class="link-button">LinkedIn</button>
          <button class="link-button">Twitter</button>
          <button class="link-button">Instagram</button>
        </div>
      </div>
      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">
          Frontend Mentor </a
        >. Coded by <a href="#">Joseph Chan</a>.
      </div>
    </main>
  </body>
</html>
